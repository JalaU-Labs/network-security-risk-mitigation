name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Yamllint
        run: uv run yamllint -c .yamllint.yml docker-compose.yml .github/workflows/ci.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest
        run: uv run pytest -v --cov=src --cov-report=term-missing

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/api
          file: ./docker/api/Dockerfile
          push: false
          tags: lab6-api:ci

      - name: Generate dummy TLS certificates for CI
        run: |
          mkdir -p docker/nginx/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout docker/nginx/certs/key.pem \
            -out docker/nginx/certs/cert.pem \
            -subj "/CN=localhost"

      - name: Build Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          file: ./docker/nginx/Dockerfile
          push: false
          tags: lab6-nginx:ci