services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-labdb}
    networks:
      - backend
    volumes:
      - mysql_data:/var/lib/mysql

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
    depends_on:
      - api

  api:
    build:
      context: ./docker/api
      dockerfile: Dockerfile
    container_name: api
    environment:
      MODULE_NAME: main
      VARIABLE_NAME: app
    networks:
      - frontend
      - backend
    depends_on:
      - mysql
      - redis

  redis:
    image: redis:7
    container_name: redis
    networks:
      - backend

  admin:
    image: nicolaka/netshoot
    container_name: admin
    networks:
      - frontend
    stdin_open: true
    tty: true
    command: /bin/bash

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  mysql_data:
