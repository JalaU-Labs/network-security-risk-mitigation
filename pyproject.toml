[project]
name = "network-security-risk-mitigation"
version = "0.1.0"
description = "Network security risk mitigation lab for Computer Networks 2"
authors = [
    { name = "Diego Alejandro Botina", email = "code.with.botina@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
network-security-risk-mitigation = "network_security_risk_mitigation:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "yamllint>=1.38.0",
]
